<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>粉紫 MQTT 控制面板</title>
  <style>
    :root { --ink:#443650; --muted:#85778f; --purple:#9a71d6; --deep:#7651bd; --pale:#f5efff; --line:#e9ddfa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif; color:var(--ink); background:radial-gradient(ellipse at 15% 6%,#eedbff 0,transparent 40%),radial-gradient(ellipse at 93% 88%,#f2e1fa 0,transparent 42%),#fbf9ff; display:grid; place-items:center; padding:24px; }
    main { width:min(100%,570px); background:rgba(255,255,255,.92); padding:35px; border:1px solid #efe7f8; border-radius:28px; box-shadow:0 18px 60px #8d6ab626; }
    .eyebrow { color:#9a7aba; font-size:12px; font-weight:700; letter-spacing:2px; }
    h1 { margin:8px 0 7px; font-size:29px; letter-spacing:.2px; }
    .hint { color:var(--muted); margin:0 0 26px; font-size:14px; line-height:1.7; }
    .status { display:flex; align-items:center; justify-content:space-between; gap:15px; background:var(--pale); border:1px solid var(--line); border-radius:18px; padding:17px 18px; margin-bottom:21px; }
    .status-title { font-weight:750; font-size:14px; }
    .sub { display:block; color:var(--muted); font-size:12px; margin-top:5px; overflow-wrap:anywhere; }
    .pill { white-space:nowrap; border-radius:30px; padding:7px 12px; font-size:12px; font-weight:800; background:#ece6f1; color:#776b80; }
    .pill::before { content:""; display:inline-block; height:8px; width:8px; background:currentColor; border-radius:50%; margin-right:6px; }
    .pill.connected { background:#e0f6e9; color:#28774c; }
    .pill.connecting { background:#fff1d4; color:#99680c; }
    .pill.offline { background:#ffe4ea; color:#b34b70; }
    .controls { text-align:center; padding:17px 0 12px; }
    .send { cursor:pointer; width:180px; height:180px; border:0; border-radius:50%; color:white; background:linear-gradient(145deg,#c59bed,#9164d1); box-shadow:0 14px 32px #9569cb60,inset 0 3px 7px #ffffff50; font-size:23px; font-weight:800; letter-spacing:.7px; transition:transform .17s,box-shadow .17s,opacity .17s; }
    .send:not(:disabled):hover { transform:translateY(-3px); box-shadow:0 18px 38px #9569cb7a,inset 0 3px 7px #ffffff50; }
    .send:not(:disabled):active { transform:scale(.96); }
    .send:disabled { cursor:not-allowed; opacity:.55; }
    .button-note { margin-top:16px; color:var(--muted); font-size:13px; }
    .button-note strong { color:var(--deep); }
    .info { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:22px 0; }
    .info > div { background:#faf7ff; border:1px solid #f0e8fa; padding:13px 15px; border-radius:14px; min-width:0; }
    .label { color:var(--muted); font-size:12px; margin-bottom:5px; }
    .value { font-size:14px; font-weight:750; overflow-wrap:anywhere; }
    .section-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
    h2 { margin:0; font-size:15px; }
    .linkbtn { border:0; background:transparent; color:var(--deep); cursor:pointer; font-weight:700; font-size:12px; padding:4px; }
    .log { height:180px; overflow:auto; border:1px solid var(--line); background:#fcfaff; border-radius:14px; padding:10px 13px; font-size:12px; line-height:1.8; }
    .entry { border-bottom:1px solid #f0eafa; padding:4px 0; overflow-wrap:anywhere; }
    .entry:last-child { border:0; }
    .time { color:#a396ae; margin-right:7px; font-variant-numeric:tabular-nums; }
    footer { margin-top:17px; font-size:11px; color:#92859b; line-height:1.6; }
    @media(max-width:480px) { main { padding:24px 19px; } h1 {font-size:25px;} .info {grid-template-columns:1fr;} .send {width:160px;height:160px;} }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">LAVENDER · SMART CONTROL</div>
  <h1>MQTT 控制面板</h1>
  <p class="hint">自動連接伺服器，一鍵發送指令，隨時掌握連線狀態。</p>

  <section class="status" aria-live="polite">
    <div><div class="status-title">伺服器連線狀態</div><span id="statusDetail" class="sub">正在準備連線…</span></div>
    <span id="status" class="pill connecting">連線中</span>
  </section>

  <section class="controls">
    <button id="sendBtn" class="send" disabled>發送指令</button>
    <div class="button-note">點擊發送 <strong>b1_on</strong></div>
  </section>

  <section class="info" aria-label="MQTT 設定">
    <div><div class="label">MQTT Broker</div><div class="value">broker.emqx.io</div></div>
    <div><div class="label">網頁安全連線</div><div class="value">WSS · 8084</div></div>
    <div><div class="label">訂閱 / 發布 Topic</div><div class="value">jjlab/a</div></div>
    <div><div class="label">最新收到的內容</div><div id="lastMessage" class="value">尚無訊息</div></div>
  </section>

  <div class="section-header"><h2>即時事件紀錄</h2><button id="clearLog" class="linkbtn">清除紀錄</button></div>
  <div id="log" class="log" role="log" aria-live="polite"></div>
  <footer>注意：broker.emqx.io 為公開測試伺服器。任何人都可能訂閱或向 jjlab/a 發送訊息，請勿傳送私人資料或操作具安全風險的設備。</footer>
</main>
<script src="https://unpkg.com/mqtt@5.15.0/dist/mqtt.min.js"></script>
<script>
  'use strict';
  const BROKER = 'wss://broker.emqx.io:8084/mqtt';
  const TOPIC = 'jjlab/a';
  const PAYLOAD = 'b1_on';
  const $ = id => document.getElementById(id);
  const sendBtn = $('sendBtn');
  let client;

  function log(message) {
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    entry.append(time, document.createTextNode(message));
    $('log').prepend(entry);
    while ($('log').children.length > 80) $('log').lastElementChild.remove();
  }
  function setStatus(label, type, detail) {
    $('status').textContent = label;
    $('status').className = 'pill ' + type;
    $('statusDetail').textContent = detail;
    sendBtn.disabled = type !== 'connected';
  }
  $('clearLog').addEventListener('click', () => { $('log').replaceChildren(); log('已清除畫面紀錄'); });
  sendBtn.addEventListener('click', () => {
    if (!client || !client.connected) { log('無法傳送：目前未連線'); return; }
    client.publish(TOPIC, PAYLOAD, { qos: 1, retain: false }, error => {
      if (error) log('發送失敗：' + error.message);
      else log('✓ 已發布到 ' + TOPIC + '：' + PAYLOAD + '（Broker 確認）');
    });
  });

  if (typeof mqtt === 'undefined') {
    setStatus('載入失敗', 'offline', '無法載入 MQTT.js，請檢查網路或 CDN 連線');
    log('MQTT.js 程式庫載入失敗');
  } else {
    log('準備自動連線至 broker.emqx.io');
    client = mqtt.connect(BROKER, {
      clientId: 'jjlab_web_' + Math.random().toString(16).slice(2, 10),
      clean: true,
      keepalive: 60,
      connectTimeout: 12000,
      reconnectPeriod: 3000,
      protocolVersion: 4
    });
    client.on('connect', () => {
      setStatus('已連線', 'connected', 'MQTT Broker 連線成功');
      log('✓ 已連接 MQTT Broker');
      client.subscribe(TOPIC, { qos: 1 }, (err, granted) => {
        if (err) { log('訂閱失敗：' + err.message); return; }
        log('✓ 訂閱成功：' + (granted || []).map(x => x.topic).join(', '));
      });
    });
    client.on('message', (topic, payload) => {
      const value = payload.toString();
      $('lastMessage').textContent = value || '（空訊息）';
      log('← 收到 [' + topic + ']：' + (value || '（空訊息）'));
    });
    client.on('reconnect', () => { setStatus('重新連線中', 'connecting', '連線中斷，正在每 3 秒重試'); log('↻ 正在重新連線…'); });
    client.on('offline', () => { setStatus('已離線', 'offline', '目前無法連接伺服器'); log('伺服器連線離線'); });
    client.on('close', () => { setStatus('連線中斷', 'offline', '連線已關閉，將嘗試重新連接'); });
    client.on('error', err => { setStatus('連線異常', 'offline', '連線發生錯誤，將自動重試'); log('錯誤：' + err.message); });
  }
</script>
</body>
</html>
